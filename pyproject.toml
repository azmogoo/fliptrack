[project]
name = "fliptrack"
version = "0.1.0"
description = "resell profit calculator and inventory tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "azmogoo" }]
dependencies = []

[project.scripts]
fliptrack = "fliptrack.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fliptrack*"]
